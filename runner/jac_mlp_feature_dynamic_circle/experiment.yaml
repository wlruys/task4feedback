cli_base: "python experiments/train.py --config-name 8x8x128_dynamic_circle_mlp.yaml"

packs:
  - name: wbconfig
    options:
      - wandb:
          project: stencil_mlp_feature_dynamic_circle
        tag: "stencil-MLP-Feature"
  - name: collections
    options:
      - algorithm:
          num_collections: 10000
        tag: "10k"
  - name: entropy
    options:
      - algorithm:
          ent_coef: 0.00025
        tag: "e0.00025"
  - name: rollout
    options:
      - algorithm:
          rollout_steps: 32
          minibatch_size: 32
        tag: "mb32-r32"
  - name: size
    options:
      - graph:
          config:
            n: 8
            steps: 256
        tag: "b8"
  - name: batch
    options:
      - feature:
          observer:
            n_candidates: 1
        tag: "c1"
      - feature:
          observer:
            n_candidates: 16
        tag: "c16"
      - feature:
          observer:
            n_candidates: 64
        tag: "c64"
  - name: architecture
    options:
      - feature:
          observer:
            version: "A"
        tag: "Top-Pred-Device"
      - feature:
          observer:
            version: "B"
        tag: "Top-Pred-Device-Residency"
      - feature:
          observer:
            version: "C"
        tag: "Top-Pred-Device-Residency-Coord"
  - name: reward
    options:
      - reward:
          pbrs: True
          sparse_reward_scale: 10
          dense_reward_scale: 10
        tag: "pbrs"
  - name: block_time
    options:
      - graph:
          config:
            r_interior: 1
            r_boundary: 0.1
        tag: "1:1:0.1"
      - graph:
          config:
            r_interior: 10
            r_boundary: 0.1
        tag: "1:10:0.1"
      - graph:
          config:
            r_interior: 1
            r_boundary: 1
        tag: "1:1:1"
  - name: seed
    options:
      - seed: 42
        tag: "seed42"
      - seed: 923475
        tag: "seed923475"
      - seed: 23404847
        tag: "seed23404847"
      - seed: 1257345
        tag: "seed1257345"
      - seed: 1110004433
        tag: "seed1110004433"
      - seed: 3442234677
        tag: "seed3442234677"