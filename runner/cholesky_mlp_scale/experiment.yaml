cli_base: "python experiments/train.py --config-name cholesky_4_mlp.yaml"

packs:
  - name: wbconfig
    options:
      - wandb:
          project: chol_mlp_scale
        tag: "ScaleTest"
  - name: collections
    options:
      - algorithm:
          num_collections: 7000
        tag: "nc7k"
  - name: entropy
    options:
      - algorithm:
          ent_coef: 0.001
        tag: "e0.001"
  - name: rollout
    options:
      - algorithm:
          rollout_steps: 128
          minibatch_size: 128
        tag: "r128"
      - algorithm:
          rollout_steps: 256
          minibatch_size: 128
        tag: "r256"
      - algorithm:
          rollout_steps: 512
          minibatch_size: 128
        tag: "r512"
  - name: size
    options:
      - graph:
          config:
            n: 4
        tag: "b4"
      - graph:
          config:
            n: 5
        tag: "b4"
      - graph:
          config:
            n: 6
        tag: "b6"
      - graph:
          config:
            n: 7
        tag: "b6"
      - graph:
          config:
            n: 8
        tag: "b8"
      - graph:
          config:
            n: 9
        tag: "b9"
      - graph:
          config:
            n: 10
        tag: "b10"
  - name: arthitecture
    options:
        - feature:
            observer:
              version: "E"
              add_degree: True
          tag: "MLP-E-Degree"
  - name: reward
    options:
      - reward:
          pbrs: True
          sparse_reward_scale: 10
          dense_reward_scale: 10
        tag: "pbrs"
      - reward:
          pbrs: False
          sparse_reward_scale: 0
          dense_reward_scale: 10
        tag: "sparse_reward"
  - name: block_time
    options:
      - graph:
          config:
            block_time: 0
            task_time: 30000
        tag: "1:0"
      - graph:
          config:
            block_time: 20000
            task_time: 30000
        tag: "1:2"
  - name: seed
    options:
      - seed: 42
        tag: "seed42"
      - seed: 256
        tag: "seed256"