cli_base: "python experiments/train.py --config-name cholesky_4_mlp.yaml"

packs:
  - name: wbconfig
    options:
      - wandb:
          project: chol_mlp_feature
        tag: "Chol-MLP-Feature"
  - name: collections
    options:
      - algorithm:
          num_collections: 3000
        tag: "3k"
  - name: entropy
    options:
      - algorithm:
          ent_coef: 0.0001
        tag: "e0.0001"
  - name: rollout
    options:
      - algorithm:
          rollout_steps: 64
          minibatch_size: 64
        tag: "mb64-r64"
  - name: size
    options:
      - graph:
          config:
            n: 6
        tag: "b6"
      - graph:
          config:
            n: 12
        tag: "b12"
      - graph:
          config:
            n: 24
        tag: "b24"
  - name: batch
    options:
      - feature:
          observer:
            n_candidates: 1
        tag: "c1"
      - feature:
          observer:
            n_candidates: 32
        tag: "c32"
  - name: architecture
    options:
        - feature:
            observer:
              version: "A"
          tag: "Top-Pred-Device"
        - feature:
            observer:
              version: "B"
          tag: "Top-Pred-Device-Residency"
        - feature:
            observer:
              version: "C"
          tag: "Top-Pred-Device-Residency-Coord"
  - name: reward
    options:
      - reward:
          pbrs: True
          sparse_reward_scale: 10
          dense_reward_scale: 10
        tag: "pbrs"
  - name: block_time
    options:
      - graph:
          config:
            block_time: 40000
            task_time: 30000
        tag: "1:4"
      - graph:
          config:
            block_time: 80000
            task_time: 30000
        tag: "1:8"
  - name: seed
    options:
      - seed: 42
        tag: "seed42"
      - seed: 923475
        tag: "seed923475"
      - seed: 1110004433
        tag: "seed1110004433"
      - seed: 3442234677
        tag: "seed3442234677"
      - seed: 81087672
        tag: "seed81087672"
      - seed: 1765963171
        tag: "seed1765963171"
      - seed: 1253822285
        tag: "seed1253822285"
      - seed: 810132442
        tag: "seed810132442"
      - seed: 2017945801
        tag: "seed2017945801"
      - seed: 3169876321
        tag: "seed3169876321"