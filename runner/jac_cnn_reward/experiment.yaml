cli_base: "python experiments/train.py --config-name 4x4x16_static_cnn.yaml"

packs:
  - name: wbconfig
    options:
      - wandb:
          project: stencil_cnn_reward
        tag: "stencil-CNN-Reward"
  - name: collections
    options:
      - algorithm:
          num_collections: 3000
        tag: "3k"
  - name: entropy
    options:
      - algorithm:
          ent_coef: 0.00025
        tag: "e0.00025"
  - name: rollout
    options:
      - algorithm:
          rollout_steps: 64
          minibatch_size: 64
        tag: "mb64-r64"
  - name: size
    options:
      - graph:
          config:
            n: 4
        tag: "b4"
  - name: architecture
    options:
        - feature:
            observer:
              version: "C"
          tag: "Top-Pred-Device-Residency-Coord"
  - name: reward
    options:
      - reward:
          pbrs: True
          sparse_reward_scale: 10
          dense_reward_scale: 10
        tag: "pbrs"
      - reward:
          pbrs: False
          sparse_reward_scale: 10
          dense_reward_scale: 0
        tag: "sparse"
  - name: block_time
    options:
      - graph:
          config:
            boundary_time: 250
            interior_time: 10000
            task_time: 10000
        tag: "1:1:0.1"
      - graph:
          config:
            boundary_time: 2500
            interior_time: 20000
            task_time: 10000
        tag: "1:2:1"
  - name: seed
    options:
      - seed: 42
        tag: "seed42"
      - seed: 256
        tag: "seed256"
      - seed: 1024
        tag: "seed1024"
      - seed: 2024
        tag: "seed2024"