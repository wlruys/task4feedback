cli_base: "python experiments/train.py --config-name 4x4x16_static_mlp.yaml"

packs:
  - name: wbconfig
    options:
      - wandb:
          project: test_dir
        tag: "TEST"
  - name: collections
    options:
      - algorithm:
          num_collections: 10000
        tag: "nc10k"
  - name: entropy
    options:
      - algorithm:
          ent_coef: 0.001
        tag: "e0.001"
  - name: data
    options:
      - graph:
          env:
            change_priority: False
            change_location: False
            change_duration: False
        tag: "static_data"
  - name: rollout
    options:
      - algorithm:
          rollout_steps: 128
          minibatch_size: 128
        tag: "r128"
      - algorithm:
          rollout_steps: 256
          minibatch_size: 128
        tag: "r256"
      - algorithm:
          rollout_steps: 512
          minibatch_size: 128
        tag: "r512"
  - name: size
    options:
      - graph:
          config:
            n: 4
        tag: "b4"
  - name: steps
    options:
      - graph:
          config:
            steps: 16
        tag: "s16"
  - name: arthitecture
    options:
        - feature:
            observer:
              version: "E"
              add_degree: True
          tag: "MLP-E-Degree"
  - name: reward
    options:
      - reward:
          pbrs: True
          sparse_reward_scale: 10
          dense_reward_scale: 10
        tag: "pbrs"
  - name: block_time
    options:
      - graph:
          config:
            interior_time: 1
            boundary_time: 1
            task_time: 40000
        tag: "1:0"
      - graph:
          config:
            interior_time: 80000
            boundary_time: 20000
            task_time: 40000
        tag: "1:2"
  - name: seed
    options:
      - seed: 42
        tag: "seed42"
      - seed: 256
        tag: "seed256"
      - seed: 1024
        tag: "seed1024"
      - seed: 2024
        tag: "seed2024"
    