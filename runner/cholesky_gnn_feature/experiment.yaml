cli_base: "python experiments/train.py --config-name cholesky_4_gnn.yaml"

packs:
  - name: wbconfig
    options:
      - wandb:
          project: chol_gnn_feature
        tag: "FeatureTest"
  - name: collections
    options:
      - algorithm:
          num_collections: 3000
        tag: "nc7k"
  - name: entropy
    options:
      - algorithm:
          ent_coef: 0.001
        tag: "e0.001"
  - name: rollout
    options:
      - algorithm:
          rollout_steps: 128
          minibatch_size: 128
        tag: "r128"
  - name: size
    options:
      - graph:
          config:
            n: 8
        tag: "b8"
  - name: arthitecture
    options:
        - feature:
            observer:
              version: "A"
              add_degree: True
          tag: "GNN-A-Degree"
        - feature:
            observer:
              version: "C"
              add_degree: True
          tag: "GNN-C-Degree"
  - name: layers
    options:
      - models:
          layers:
            state:
              num_layers: 0
        tag: "0layer"
      - models:
          layers:
            state:
              num_layers: 1
        tag: "1layer"
  - name: reward
    options:
      - reward:
          pbrs: True
          sparse_reward_scale: 10
          dense_reward_scale: 10
        tag: "pbrs"
  - name: block_time
    options:
      - graph:
          config:
            block_time: 1
            task_time: 30000
        tag: "1:0"
      - graph:
          config:
            block_time: 10000
            task_time: 30000
        tag: "1:1"
      - graph:
          config:
            block_time: 20000
            task_time: 30000
        tag: "1:2"
  - name: seed
    options:
      - seed: 42
        tag: "seed42"
      - seed: 256
        tag: "seed256"
      - seed: 1024
        tag: "seed1024"
      - seed: 2024
        tag: "seed2024"

    
