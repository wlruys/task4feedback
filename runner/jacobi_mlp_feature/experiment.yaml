cli_base: "python experiments/train.py --config-name 4x4x16_static_mlp.yaml"

packs:
  - name: wbconfig
    options:
      - wandb:
          project: "jac_mlp_feature"
        tag: "FeatureTest"
  - name: collections
    options:
      - algorithm:
          num_collections: 2000
        tag: "nc2k"
  - name: entropy
    options:
      - algorithm:
          ent_coef: 0.001
        tag: "e0.001"
  - name: rollout
    options:
      - algorithm:
          rollout_steps: 128
          minibatch_size: 128
        tag: "r128"
  - name: size
    options:
      - graph:
          config:
            n: 4
        tag: "b4"
  - name: arthitecture
    options:
        - feature:
            observer:
              version: "E"
              add_degree: True
          tag: "MLP-E-Degree"
        - feature:
            observer:
              version: "A"
              add_degree: True
          tag: "MLP-A-Degree"
        - feature:
            observer:
              version: "B"
              add_degree: True
          tag: "MLP-B-Degree"
        - feature:
            observer:
              version: "C"
              add_degree: True
          tag: "MLP-C-Degree"
  - name: reward
    options:
      - reward:
          pbrs: True
          sparse_reward_scale: 10
          dense_reward_scale: 10
        tag: "pbrs"
      - reward:
          pbrs: False
          sparse_reward_scale: 10
          dense_reward_scale: 0
        tag: "sparse_reward"
  - name: block_time
    options:
      - graph:
          config:
            interior_time: 1
            boundary_time: 1
            task_time: 10000
        tag: "1:0"
      - graph:
          config:
            interior_time: 10000
            boundary_time: 2500
            task_time: 10000
        tag: "2:1"
      - graph:
          config:
            interior_time: 15000
            boundary_time: 5000
            task_time: 10000
        tag: "1:1"
      - graph:
          config:
            interior_time: 20000
            boundary_time: 10000
            task_time: 10000
        tag: "1:2"
      - graph:
          config:
            interior_time: 40000
            boundary_time: 10000
            task_time: 10000
        tag: "1:4"
  - name: seed
    options:
      - seed: 42
        tag: "seed42"
      - seed: 256
        tag: "seed256"
      - seed: 1024
        tag: "seed1024"
      - seed: 2024
        tag: "seed2024"
      - seed: 4096
        tag: "seed4096"

    