cli_base: "python experiments/train.py --config-name 8x8x128_dynamic_circle_mlp.yaml"

packs:
  - name: wbconfig
    options:
      - wandb:
          project: stencil_mlp_reward_dynamic_circle
        tag: "stencil-MLP-Reward"
  - name: collections
    options:
      - algorithm:
          num_collections: 3000
        tag: "3k"
  - name: entropy
    options:
      - algorithm:
          ent_coef: 0.0001
        tag: "e0.0001"
  - name: rollout
    options:
      - algorithm:
          rollout_steps: 64
          minibatch_size: 64
        tag: "mb64-r64"
  - name: size
    options:
      - graph:
          config:
            n: 8
            steps: 128
        tag: "b8"
  - name: batch
    options:
      - feature:
          observer:
            n_candidates: 1
        tag: "c1"
      - feature:
          observer:
            n_candidates: 16
        tag: "c16"
  - name: architecture
    options:
      - feature:
          observer:
            version: "C"
        tag: "Top-Pred-Device-Residency-Coord"
  - name: reward
    options:
      - reward:
          pbrs: True
          sparse_reward_scale: 10
          dense_reward_scale: 10
        tag: "pbrs"
      - reward:
          pbrs: False
          sparse_reward_scale: 10
          dense_reward_scale: 0
        tag: "sparse"
  - name: block_time
    options:
      - graph:
          config:
            boundary_time: 250
            interior_time: 10000
            task_time: 10000
        tag: "1:1:0.1"
      - graph:
          config:
            boundary_time: 250
            interior_time: 100000
            task_time: 10000
        tag: "1:10:0.1"
      - graph:
          config:
            boundary_time: 2500
            interior_time: 100000
            task_time: 10000
        tag: "1:10:1"
  - name: seed
    options:
      - seed: 42
        tag: "seed42"
      - seed: 256
        tag: "seed256"
      - seed: 1024
        tag: "seed1024"
      - seed: 2024
        tag: "seed2024"
