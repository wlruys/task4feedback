cli_base: "python experiments/train.py --config-name 8x8x128_dynamic_circle_cnn.yaml"

packs:
  - name: wbconfig
    options:
      - wandb:
          project: stencil_cnn_feature_dynamic_circle
        tag: "stencil-CNN-Feature"
  - name: collections
    options:
      - algorithm:
          num_collections: 40000
        tag: "40k"
  - name: entropy
    options:
      - algorithm:
          ent_coef: 0.00025
        tag: "e0.00025"
  - name: gamma
    options:
      - algorithm:
          gamma: 0.99
        tag: "g0.99"
  - name: rollout
    options:
      - algorithm:
          rollout_steps: 32
          minibatch_size: 32
        tag: "mb32-r32"
  - name: size
    options:
      - graph:
          config:
            n: 8
            steps: 256
        tag: "b8"
  - name: architecture
    options:
      - feature:
          observer:
            version: "A"
        tag: "Top-Pred-Device"
      - feature:
          observer:
            version: "B"
        tag: "Top-Pred-Device-Residency"
      - feature:
          observer:
            version: "C"
        tag: "Top-Pred-Device-Residency-Coord"
  - name: reward
    options:
      - reward:
          pbrs: True
          sparse_reward_scale: 10
          dense_reward_scale: 10
        tag: "pbrs"
  - name: block_time
    options:
      - graph:
          config:
            r_interior: 2
            r_boundary: 2
        tag: "1:2:2"
  - name: seed
    options:
      - seed: 42
        tag: "seed42"
      - seed: 923475
        tag: "seed923475"
      - seed: 1110004433
        tag: "seed1110004433"
      - seed: 3442234677
        tag: "seed3442234677"
      - seed: 81087672
        tag: "seed81087672"
      - seed: 1765963171
        tag: "seed1765963171"
      - seed: 1253822285
        tag: "seed1253822285"
      - seed: 810132442
        tag: "seed810132442"
      - seed: 2017945801
        tag: "seed2017945801"
      - seed: 3169876321
        tag: "seed3169876321"
