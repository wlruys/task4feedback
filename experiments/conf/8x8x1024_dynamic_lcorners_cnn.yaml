defaults:
  - 8x8x1024_dynamic_lcorners.yaml
  - feature: cnn_batch
  - network: cond_dilation_cnn_batch
  - _self_

optimizer:
  lr: 1e-3

system:
  mem: 80e9

feature:
  observer:
    prev_frames: 1
    batched: true
    version: D
  normalization:
    warmup: 1
  add_device_load: True

network:
  layers:
    state:
      hidden_channels: 16
    actor:
      hidden_channels: 16
    critic:
      hidden_channels: 128
  critic:
    add_progress: True

wandb:
  name: CNN-A_IEFT
  project: test