defaults:
  - 16x16x128_dynamic_circle.yaml
  - feature: cnn_batch
  - network: cond_dilation_cnn_batch
  - _self_

algorithm:
  rollout_steps: 32
  minibatch_size: 32

optimizer:
  lr: 1e-3

feature:
  observer:
    prev_frames: 1
    batched: true
    version: F
    spec:
      max_devices: 9
  normalization:
    warmup: 10
  add_device_load: True

network:
  layers:
    state:
      hidden_channels: 16
    actor:
      hidden_channels: 16
    critic:
      hidden_channels: 128
  critic:
    add_progress: True

wandb:
  name: CNN-A_IEFT
