defaults:
  - 4x4x16_static.yaml
  - feature: gnn_single
  - network: gnn_baseline
  - _self_

algorithm:
  rollout_steps: 16
  minibatch_size: 16

feature:
  observer:
    grid_override: False
    n_candidates: 16
    version: "D"
    add_degree: True
  normalization:
    warmup: 1
  add_device_load: True

network:
  layers:
    state:
      hidden_channels: 16
    actor:
      hidden_channels: 32
    critic:
      hidden_channels: 64
  critic:
    add_progress: True

wandb:
  name: lowentGNN-E_IS
  project: jacobi_deb
