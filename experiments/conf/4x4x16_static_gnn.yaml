defaults:
  - 4x4x16_static.yaml
  - feature: gnn_single
  - network: original_gnn_baseline
  - _self_

algorithm:
  rollout_steps: 128
  minibatch_size: 128

feature:
  observer:
    prev_frames: 1
    grid_override: false
    n_candidates: 1
    version: "C"
    add_degree: True
  normalization:
    warmup: 20
  add_device_load: True
  

network:
  layers:
    state:
      hidden_channels: 16
    actor:
      hidden_channels: 32
    critic:
      hidden_channels: 64
  critic:
    add_progress: True

wandb:
  name: CNN-E_IS
  project: jacobi_deb
