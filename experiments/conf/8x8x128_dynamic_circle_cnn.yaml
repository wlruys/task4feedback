defaults:
  - 8x8x128_dynamic_circle.yaml
  - feature: gnn_batch
  - network: cond_dilation_gnn_batch
  - _self_

algorithm:
  rollout_steps: 32
  minibatch_size: 32

optimizer:
  lr: 1e-3

feature:
  observer:
    prev_frames: 1
    grid_override: False
    graph_override: True
    n_candidates: 64
    version: "C"
  normalization:
    warmup: 1
  add_device_load: True

network:
  layers:
    state:
      hidden_channels: 16
    actor:
      hidden_channels: 16
    critic:
      hidden_channels: 128
  critic:
    add_progress: True

wandb:
  name: CNN-A_IEFT
