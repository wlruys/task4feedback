defaults:
  - _self_
  - graph: dynamic_jacobi_bump
  - reward: incremental_schedule
  - system: uniform
  - feature: mlp
  - models: mlp_baseline
  - timing: default
  - algorithm: ppo
  - runtime: batch
  - noise: none 
  - wandb: default
  - logging: default
  - lr_scheduler: none 
  - optimizer: adamw
  - eval: default

hydra:
  callbacks:
    git_info:
      _target_: task4feedback.exp_utils.gitinfo.GitInfo
seed: 101
deterministic_torch: true
