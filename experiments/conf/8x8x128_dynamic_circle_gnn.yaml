defaults:
  - 8x8x128_dynamic_circle.yaml
  - feature: gnn_batch
  - network: cond_dilation_gnn_batch
  - _self_


algorithm:
  rollout_steps: 32
  minibatch_size: 32
  gamma: 0.99
  ent_coef: 0.00025

reward:
  pbrs: True
  sparse_reward_scale: 10
  dense_reward_scale: 10



graph:
  config:
    steps: 256
    n: 8
    r_interior: 2
    r_boundary: 2

optimizer:
  lr: 1e-3

feature:
  observer:
    prev_frames: 1
    grid_override: False
    graph_override: True
    n_candidates: 64
    version: "C"
  normalization:
    warmup: 20
  add_device_load: True

network:
  layers:
    state:
      hidden_channels: 16
    actor:
      hidden_channels: 16
    critic:
      hidden_channels: 128
  critic:
    add_progress: True

wandb:
  name: GNN-A_IEFT
