defaults:
  - 8x8x128_dynamic_circle.yaml
  - feature: gnn_batch
  - network: gnn_baseline
  - _self_

algorithm:
  rollout_steps: 32
  minibatch_size: 32

optimizer:
  lr: 1e-3

system:
  mem: 96e9

feature:
  observer:
    prev_frames: 1
    batched: true
    version: C
  normalization:
    warmup: 10
  add_device_load: True

network:
  layers:
    state:
      hidden_channels: 16
    actor:
      hidden_channels: 16
    critic:
      hidden_channels: 128
  critic:
    add_progress: True

wandb:
  name: GNN-Circle


arch: gnn