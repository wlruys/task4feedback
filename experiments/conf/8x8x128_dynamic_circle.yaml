defaults:
  - graph: dynamic_jacobi_circle
  - reward: incremental_schedule
  - system: 4h100
  - algorithm: ppo
  - runtime: batch
  - wandb: default
  - logging: default
  - lr_scheduler: none 
  - noise: none
  - optimizer: adamw
  - eval: default
  - _self_

hydra:
  callbacks:
    git_info:
      _target_: train.GitInfo

seed: 256
deterministic_torch: true

reward:
  verbose: False
  random_start: False
  terminal_reward: True
  gamma: 0.999

graph:
  config:
    steps: 128
    n: 8
    level_memory: 44e9
    boundary_width: 0.25
    boundary_complexity: 1
    arithmetic_intensity: 595.5555555
    task_internal_memory: 0
    arithmetic_complexity: 1

  env:
    change_priority: False
    change_location: True
    change_duration: False
    seed: 1

algorithm:
  num_collections: 10000
  rollout_steps: 32
  workers: 4
  graphs_per_collection: 4
  ent_coef: 0.00025
  slice_len: 16
  gamma: 0.99
  lmbda: 0.95
  minibatch_size: 32
  collector: "multi_sync"
  max_grad_norm: 0.5
  value_norm: "l1"

optimizer:
  lr: 1e-3

system:
  mem: 999e9

runtime:
  batch_size: 5
  queue_threshold: 5
  max_in_flight: 64

wandb:
  enabled: true
  project: 8x8x128_dynamic_circle
  name: CNN-A_IEFT

eval:
  animation_interval: 100
  eval_interval: 100
  max_frames: 400
  video_seconds: 15
  samples: 1

sweep:
  n_samples: 10
  task_th: 0.4
  level_size_step: 1e9
  start_mem: 1e9
  end_mem: 200e9
  exps: ["EFT", "GlbAvg", "Oracle", "BlockCyclic", "ParMETIS", "Quad"]
