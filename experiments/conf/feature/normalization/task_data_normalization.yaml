# @package feature.normalization
enabled: true
warmup: 40  
specs:
  - name: "tasks_attr"
    in_keys: [["observation", "nodes", "tasks", "attr"]]
    eps: 1e-4 
    standard_normal: true  
    reduce_dim: [0, 1] 
    cat_dim: 0
  - name: "data_attr"
    in_keys: [["observation", "nodes", "data", "attr"]]
    eps: 1e-4
    standard_normal: true
    reduce_dim: [0, 1]
    cat_dim: 0
  - name: "device_memory"
    in_keys: [["observation", "aux", "device_memory"]]
    eps: 1e-4
    standard_normal: true
    reduce_dim: [0]
    cat_dim: 0
  - name: "device_load"
    in_keys: [["observation", "aux", "device_load"]]
    eps: 1e-4
    standard_normal: true
    reduce_dim: [0]
    cat_dim: 0
