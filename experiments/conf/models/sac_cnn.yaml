defaults:
  - components/encoders/cnn@policy.encoder
  - components/heads/cnn_actor@policy.head
  - components/encoders/cnn@qvalue.encoder
  - components/heads/cnn_qvalue@qvalue.head
  - _self_

_target_: task4feedback.ml.builders.build_model

policy:
  name: policy
  inputs:
    - [observation]
  nodes:
    encode:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.policy.encoder}
    head:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.policy.head}
  outputs:
    - [logits]

qvalue:
  name: qvalue
  inputs:
    - [observation]
    - [action]
  nodes:
    encode:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.qvalue.encoder}
    head:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.qvalue.head}
  outputs:
    - [action_value]

meta:
  name: sac_cnn_model

namespacing:
  local_prefix: [net]
  public_keys:
    - [observation]
    - [done]
    - [terminated]
    - [truncated]
    - [reward]
    - [candidate_mask]
    - [logits]
    - [action]
    - [sample_log_prob]
    - [action_value]
  public_prefixes:
    - [rnn]

validation:
  check_missing: true
  check_collisions: true
  check_cycles: true
  topo_tiebreak: lexicographic
  dry_run: false
