defaults:
  - components/encoders/mlp@qvalue.encoder
  - components/heads/mlp_qvalue@qvalue.head
  - _self_

_target_: task4feedback.ml.builders.build_model

qvalue:
  name: qvalue
  inputs:
    - [observation]
  nodes:
    encode:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.qvalue.encoder}
    head:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.qvalue.head}
  outputs:
    - [action_value]
  encoder:
    hidden_channels: [32, 32, 32]
  head:
    hidden_channels: 128

meta:
  name: dqn_mlp_model

namespacing:
  local_prefix: [net]
  public_keys:
    - [observation]
    - [done]
    - [terminated]
    - [truncated]
    - [reward]
    - [candidate_mask]
    - [action]
    - [action_value]
  public_prefixes:
    - [rnn]

validation:
  check_missing: true
  check_collisions: true
  check_cycles: true
  topo_tiebreak: lexicographic
  dry_run: false
