defaults:
  - modules/mlp_state_net@layers.state
  - modules/mlp_policy_head@layers.actor
  - modules/mlp_value_head@layers.critic
  - templates/simple_actor@actor
  - templates/simple_critic@critic

_target_: task4feedback.ml.builders.build_actor_critic

meta:
  name: mlp_model

namespacing:
  local_prefix: [net]
  public_keys:
    - [observation]
    - [done]
    - [terminated]
    - [truncated]
    - [reward]
    - [candidate_mask]
    - [logits]
    - [action]
    - [sample_log_prob]
    - [state_value]
  public_prefixes:
    - [rnn]

validation:
  check_missing: true
  check_collisions: true
  check_cycles: true
  topo_tiebreak: lexicographic
  dry_run: false

layers:
  state:
    hidden_channels: [32, 32, 32]
  actor:
    hidden_channels: 32
  critic:
    hidden_channels: 128

