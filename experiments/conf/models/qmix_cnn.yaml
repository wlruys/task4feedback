defaults:
  - components/encoders/cnn@qvalue.encoder
  - components/heads/cnn_qvalue@qvalue.head
  - _self_

_target_: task4feedback.ml.builders.build_model

# Q-Value Network (Per-Agent, CNN-based)
qvalue:
  name: qvalue
  inputs:
    - [observation]
  nodes:
    encode:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.qvalue.encoder}
    head:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.qvalue.head}
  outputs:
    - [action_value]
  encoder:
    hidden_channels: 32
  head:
    hidden_channels: 128
    add_gap: true

meta:
  name: qmix_cnn_model

namespacing:
  local_prefix: [net]
  public_keys:
    - [observation]
    - [done]
    - [terminated]
    - [truncated]
    - [reward]
    - [candidate_mask]
    - [action]
    - [action_value]
    - [state]
  public_prefixes:
    - [rnn]

validation:
  check_missing: true
  check_collisions: true
  check_cycles: true
  topo_tiebreak: lexicographic
  dry_run: false
