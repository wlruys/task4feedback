defaults:
  - components/encoders/cnn@policy.encoder
  - components/heads/cnn_actor@policy.head
  - components/encoders/cnn@value.encoder
  - components/heads/cnn_critic@value.head
  - _self_

_target_: task4feedback.ml.builders.build_model

policy:
  name: policy
  inputs:
    - [observation]
  nodes:
    encode:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.policy.encoder}
    head:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.policy.head}
  outputs:
    - [logits]

value:
  name: value
  inputs:
    - [observation]
  nodes:
    encode:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.value.encoder}
    head:
      _target_: task4feedback.ml.nodes.ModuleNode
      module: ${models.value.head}
  outputs:
    - [state_value]

meta:
  name: cnn_model

namespacing:
  local_prefix: [net]
  public_keys:
    - [observation]
    - [done]
    - [terminated]
    - [truncated]
    - [reward]
    - [candidate_mask]
    - [logits]
    - [action]
    - [sample_log_prob]
    - [state_value]
  public_prefixes:
    - [rnn]

validation:
  check_missing: true
  check_collisions: true
  check_cycles: true
  topo_tiebreak: lexicographic
  dry_run: false
