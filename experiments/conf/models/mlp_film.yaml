defaults:
  - templates/standard_network@policy
  - templates/standard_network@value
  - components/encoders/mlp_film@policy.encoder
  - components/heads/mlp_actor@policy.head
  - components/encoders/mlp_film@value.encoder
  - components/heads/mlp_critic@value.head
  - _self_

_target_: task4feedback.ml.builders.build_model

policy:
  outputs:
    - [logits]
  encoder:
    hidden_channels: [32, 32, 32]
  head:
    hidden_channels: 32

value:
  outputs:
    - [state_value]
  encoder:
    hidden_channels: [32, 32, 32]
  head:
    hidden_channels: 128

meta:
  name: mlp_film_model

namespacing:
  local_prefix: [net]
  public_keys:
    - [observation]
    - [done]
    - [terminated]
    - [truncated]
    - [reward]
    - [candidate_mask]
    - [logits]
    - [action]
    - [sample_log_prob]
    - [state_value]
  public_prefixes:
    - [rnn]

validation:
  check_missing: true
  check_collisions: true
  check_cycles: true
  topo_tiebreak: lexicographic
  dry_run: false