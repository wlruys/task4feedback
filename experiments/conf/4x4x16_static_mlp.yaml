defaults:
  - 4x4x16_static.yaml
  - feature: candidate_coordinate
  - network: vector_baseline
  - _self_

algorithm:
  rollout_steps: 16
  minibatch_size: 16

feature:
  observer:
    grid_override: False
    n_candidates: 64
    version: E
  normalization:
    warmup: 20
  add_device_load: True

network:
  layers:
    state:
      hidden_channels: [16, 16]
    actor:
      hidden_channels: 16
    critic:
      hidden_channels: 128
  critic:
    add_progress: True

wandb:
  name: independent-mlp-E_IS
  project: jacobi_deb