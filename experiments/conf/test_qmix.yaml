defaults:
  - graph: dynamic_jacobi
  - env: batch_deterministic
  - system: 4h100
  - algorithm: qmix
  - wandb: default
  - logging: default
  - optimizer: adamw
  - eval: default
  - timing: default
  - feature: mlp
  - models: qmix_mlp
  - _self_

hydra:
  callbacks:
    git_info:
      _target_: task4feedback.exp_utils.gitinfo.GitInfo

seed: 42
deterministic_torch: true

graph:
  config:
    width: 4
    length: 4
    steps: 16
    level_memory: 98e9
    boundary_time: 2500
    interior_time: 10000
    task_time: 10000

system:
  mem: 99999e9

env:
  action:
    max_candidates: 16  # 4x4 grid
  runtime:
    max_in_flight: ${env.action.max_candidates}

wandb:
  enabled: false

# Make eval run frequently for testing
eval:
  eval_interval: 2
  animation_interval: 5
  max_frames: 100
  samples: 2

algorithm:
  batch_size: 128
  num_collections: 100
  initial_random_frames: 1000
