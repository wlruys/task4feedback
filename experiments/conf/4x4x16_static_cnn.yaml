defaults:
  - 4x4x16_static.yaml
  - feature: candidate_coordinate
  - network: vector_baseline
  - _self_

algorithm:
  rollout_steps: 16
  minibatch_size: 16

feature:
  observer:
    prev_frames: 1
    grid_override: True
    n_candidates: 1
    version: H
  normalization:
    warmup: 1
  add_device_load: True
  

network:
  layers:
    state:
      hidden_channels: 16
    actor:
      hidden_channels: 16
    critic:
      hidden_channels: 128
  critic:
    add_progress: True

wandb:
  name: CNN-A_IEFT
