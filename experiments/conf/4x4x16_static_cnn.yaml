defaults:
  - 4x4x16_static.yaml
  - feature: cnn_batch
  - network: cond_dilation_cnn_batch
  - _self_

algorithm:
  rollout_steps: 16
  minibatch_size: 16

feature:
  observer:
    prev_frames: 1
    grid_override: True
    n_candidates: 64
    version: H
  normalization:
    warmup: 20
  add_device_load: True
  

network:
  layers:
    state:
      hidden_channels: 16
    actor:
      hidden_channels: 16
    critic:
      hidden_channels: 128
  critic:
    add_progress: True

wandb:
  name: rCNN-A_IEFT
  project: jacobi_deb