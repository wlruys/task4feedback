mesh:
  _target_: task4feedback.graphs.mesh.generate_quad_mesh
config:
  _target_: task4feedback.graphs.dynamic_jacobi.DynamicJacobiConfig
  steps: 256
  n: 8
  domain_ratio: 1.0
  arithmetic_intensity: 595.5555555
  arithmetic_complexity: 1.0
  boundary_width: 0.25
  boundary_complexity: 1
  memory_intensity: 0
  level_memory: 74000000000
  r_boundary: 1,
  r_interior: 0.1,
  randomness: 0.0
  permute_idx: 0
  vcu_usage: 1.0
  task_internal_memory: 0 
  morton_priority_enabled: true
  use_random_priority: false
  # Keep keys present so Hydra accepts command-line overrides.
  task_time: null
  boundary_time: null
  interior_time: null
  workload:
    _target_: task4feedback.graphs.base.TrajectoryWorkload
  workload_args:
    traj_type: circle
    lower_bound: 1
    upper_bound: 5
    scale: 0.3
    traj_specifics:
      radius: 0.3
      phase_length: 128
init:
  partitioner: metis
  nparts: 4
  gpu_only: True
  randomize: False
env:
  change_priority: False
  change_location: False
  change_duration: False
  change_workload: False
  seed: 1
type: "jacobi"
