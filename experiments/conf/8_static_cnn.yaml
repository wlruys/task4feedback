defaults:
  - 8_static.yaml
  - feature: cnn_batch
  - network: cond_dilation_cnn_batch
  - _self_

algorithm:
  rollout_steps: 64
  minibatch_size: 64

feature:
  observer:
    prev_frames: 1
    grid_override: True
    graph_override: True
    n_candidates: 1
    version: "C"
  normalization:
    warmup: 1
  add_device_load: True
  

network:
  layers:
    state:
      hidden_channels: 16
    actor:
      hidden_channels: 16
    critic:
      hidden_channels: 128
  critic:
    add_progress: True

wandb:
  name: CNN-A_IEFT
