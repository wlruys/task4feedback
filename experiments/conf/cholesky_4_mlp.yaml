defaults:
  - cholesky_4.yaml
  - feature: candidate_coordinate
  - network: vector_baseline
  - _self_

algorithm:
  rollout_steps: 128
  minibatch_size: 128

feature:
  observer:
    grid_override: False
    n_candidates: 10
    version: "E"
    add_degree: True
  normalization:
    warmup: 20
  add_device_load: True

network:
  layers:
    state:
      hidden_channels: [16]
    actor:
      hidden_channels: 32
    critic:
      hidden_channels: 64
  critic:
    add_progress: True

wandb:
  name: 1layer-MLP-E_IS
  project: chol_deb
