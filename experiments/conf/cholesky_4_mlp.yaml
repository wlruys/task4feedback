defaults:
  - cholesky_4.yaml
  - feature: candidate_coordinate
  - network: vector_baseline
  # - feature: cnn_batch
  # - network: cond_dilation_cnn_batch
  - _self_

algorithm:
  rollout_steps: 32
  minibatch_size: 32
  milestone: 32

feature:
  observer:
    grid_override: False
    n_candidates: 32
    version: "E"
    add_degree: True
  normalization:
    warmup: 20
  add_device_load: True

network:
  layers:
    state:
      hidden_channels: [16, 16]
    actor:
      hidden_channels: 16
    critic:
      hidden_channels: 128
  critic:
    add_progress: True

wandb:
  name: MLP-E_IS
  project: test
